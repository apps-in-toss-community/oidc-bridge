name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: zerocode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d zerocode_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_TEST_URL: postgresql://test:test@127.0.0.1:5432/zerocode_test
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: oidc-bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test /healthz
        run: |
          set -euo pipefail
          # Generate a throwaway RS256 key for the smoke-test.
          # The key is never used for production tokens — it only lets the
          # server pass config validation and start successfully.
          SIGNING_PEM=$(openssl genrsa 2048 2>/dev/null)
          # Bind to a random host port so parallel jobs on the same runner
          # don't collide on 8080.
          docker run -d --name oidc-bridge-ci -p 127.0.0.1:0:8080 \
            -e OIDC_ISSUER=http://localhost:8080 \
            -e OIDC_ACTIVE_KID=ci \
            -e "OIDC_SIGNING_KEY_CI_PEM=${SIGNING_PEM}" \
            oidc-bridge:ci
          host_port=$(docker port oidc-bridge-ci 8080/tcp | awk -F: 'NR==1{print $NF}')
          echo "container bound to host port $host_port"
          ok=false
          for _ in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:${host_port}/healthz"; then
              echo
              echo "healthz ok"
              ok=true
              break
            fi
            sleep 1
          done
          if [ "$ok" != "true" ]; then
            echo "healthz never became healthy" >&2
            docker logs oidc-bridge-ci >&2 || true
            exit 1
          fi
          # Validate the in-container HEALTHCHECK command also reports healthy,
          # so a regression in the HEALTHCHECK itself (not just /healthz) fails.
          for _ in $(seq 1 20); do
            status=$(docker inspect --format='{{.State.Health.Status}}' oidc-bridge-ci)
            echo "health status: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "HEALTHCHECK never reported healthy" >&2
          docker logs oidc-bridge-ci >&2 || true
          exit 1

      - name: Clean up
        if: always()
        run: docker rm -f oidc-bridge-ci || true
