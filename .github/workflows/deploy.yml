name: Deploy

# Pushes to main build a fresh Docker image, push it to GHCR, then SSH into
# the community Vultr Seoul VPS and pull + restart the compose stack.
#
# Required repository secrets (see docs/DEPLOY.md):
#   VULTR_HOST     — VPS IPv4 / hostname
#   VULTR_USER     — SSH user with docker access (e.g. `deploy`)
#   VULTR_SSH_KEY  — private key matching an authorized_keys entry on the VPS
#
# GHCR auth uses the workflow-scoped GITHUB_TOKEN; no separate secret needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          repo_lc=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          sha_tag="ghcr.io/${repo_lc}:sha-${GITHUB_SHA}"
          latest_tag="ghcr.io/${repo_lc}:latest"
          {
            echo "sha_tag=${sha_tag}"
            echo "latest_tag=${latest_tag}"
            echo "tags<<EOF"
            echo "${sha_tag}"
            echo "${latest_tag}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only deploy on direct pushes to main, not on workflow_dispatch from a
    # feature branch (which would still build, but shouldn't deploy).
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # Sync the compose stack to the VPS first so changes to docker-compose.yml
      # or Caddyfile actually land. .env is intentionally NOT shipped — it holds
      # secrets and is managed out-of-band on the VPS.
      - name: Sync compose stack to Vultr
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          source: 'docker-compose.yml,Caddyfile'
          target: /opt/oidc-bridge/
          overwrite: true

      - name: Pull + restart compose stack on Vultr
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/oidc-bridge
            docker compose pull
            docker compose up -d --remove-orphans
            # Wait for the new container to report healthy before exiting.
            for _ in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || echo "starting")
              echo "app health: $status"
              if [ "$status" = "healthy" ]; then
                docker image prune -f
                exit 0
              fi
              sleep 2
            done
            echo "app never reported healthy after deploy" >&2
            docker compose logs --tail=100 app >&2 || true
            exit 1
