name: Deploy

# Pushes to main build a fresh Docker image, push it to GHCR, then SSH into
# the community Vultr Seoul VPS and pull + restart the compose stack.
#
# Required repository secrets (see docs/DEPLOY.md):
#   VULTR_HOST                — VPS IPv4 / hostname
#   VULTR_USER                — SSH user with docker access (e.g. `deploy`)
#   VULTR_SSH_KEY             — private key matching an authorized_keys entry on the VPS
#   ACME_EMAIL                — Let's Encrypt registration email for Caddy
#   MASTER_KEY_1_HEX          — 32-byte hex master key (Phase 1 sealing keys)
#   OIDC_ISSUER               — issuer URL exposed in /.well-known/openid-configuration
#   OIDC_ACTIVE_KID           — kid of the currently-signing JWKS key
#   OIDC_SIGNING_KEY_K1_PEM   — RS256 PEM for kid=k1 (slot name is fixed; see docs/RUNBOOK.md for rotation)
#
# Optional repository secrets (only emitted into .env when set):
#   STORAGE, SQLITE_PATH, DATABASE_URL,
#   MASTER_KEY_PROVIDER, MASTER_KEY_DIR,
#   ID_TOKEN_TTL_SECONDS, OIDC_DEFAULT_SCOPE,
#   OIDC_SIGNING_KEY_K2_PEM   — second key during a rotation overlap window
#
# Per-app Toss mTLS material lives in the database (apps.mtls_*_enc),
# not in env. App operators register apps via admin REST or CLI.
#
# GHCR auth uses the workflow-scoped GITHUB_TOKEN; no separate secret needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          repo_lc=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          sha_tag="ghcr.io/${repo_lc}:sha-${GITHUB_SHA}"
          latest_tag="ghcr.io/${repo_lc}:latest"
          {
            echo "sha_tag=${sha_tag}"
            echo "latest_tag=${latest_tag}"
            echo "tags<<EOF"
            echo "${sha_tag}"
            echo "${latest_tag}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only deploy on direct pushes to main, not on workflow_dispatch from a
    # feature branch (which would still build, but shouldn't deploy).
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # Render the runtime .env from GitHub Actions secrets. GHA secrets are the
      # canonical store; the VPS-side .env is treated as derived state. Only
      # secrets that are actually set get emitted, so unset optional vars fall
      # back to the image / docker-compose defaults instead of being shadowed
      # by empty strings.
      - name: Render bridge .env from secrets
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          MASTER_KEY_1_HEX: ${{ secrets.MASTER_KEY_1_HEX }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_ACTIVE_KID: ${{ secrets.OIDC_ACTIVE_KID }}
          OIDC_SIGNING_KEY_K1_PEM: ${{ secrets.OIDC_SIGNING_KEY_K1_PEM }}
          OIDC_SIGNING_KEY_K2_PEM: ${{ secrets.OIDC_SIGNING_KEY_K2_PEM }}
          STORAGE: ${{ secrets.STORAGE }}
          SQLITE_PATH: ${{ secrets.SQLITE_PATH }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASTER_KEY_PROVIDER: ${{ secrets.MASTER_KEY_PROVIDER }}
          MASTER_KEY_DIR: ${{ secrets.MASTER_KEY_DIR }}
          ID_TOKEN_TTL_SECONDS: ${{ secrets.ID_TOKEN_TTL_SECONDS }}
          OIDC_DEFAULT_SCOPE: ${{ secrets.OIDC_DEFAULT_SCOPE }}
        run: |
          set -euo pipefail
          umask 077

          missing=()
          for var in ACME_EMAIL MASTER_KEY_1_HEX OIDC_ISSUER OIDC_ACTIVE_KID OIDC_SIGNING_KEY_K1_PEM; do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secret(s): ${missing[*]}"
            echo "::error::Add them at https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            exit 1
          fi

          # emit KEY → quoted KEY="value" line, but only if value is non-empty.
          # Escapes \ and " so PEM blocks / multi-line values survive.
          emit() {
            local key="$1"
            local val="${!key:-}"
            if [ -z "$val" ]; then
              return 0
            fi
            local escaped
            escaped=$(printf '%s' "$val" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
            printf '%s="%s"\n' "$key" "$escaped" >> .env.render
          }

          : > .env.render
          {
            echo "# Rendered by .github/workflows/deploy.yml at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# Source of truth: GitHub Actions secrets. Do not edit on the VPS."
          } >> .env.render

          emit ACME_EMAIL
          emit MASTER_KEY_1_HEX
          emit OIDC_ISSUER
          emit OIDC_ACTIVE_KID
          emit OIDC_SIGNING_KEY_K1_PEM
          emit OIDC_SIGNING_KEY_K2_PEM
          emit STORAGE
          emit SQLITE_PATH
          emit DATABASE_URL
          emit MASTER_KEY_PROVIDER
          emit MASTER_KEY_DIR
          emit ID_TOKEN_TTL_SECONDS
          emit OIDC_DEFAULT_SCOPE

          echo "rendered $(grep -c '^[A-Z]' .env.render) env var(s) into .env.render"

      # Sync the compose stack + rendered .env to the VPS. The .env is uploaded
      # as `.env.render` and atomically renamed on the VPS so an in-flight
      # docker compose pull never sees a half-written file.
      - name: Sync compose stack to Vultr
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          source: 'docker-compose.yml,Caddyfile,.env.render'
          target: /opt/oidc-bridge/
          overwrite: true

      - name: Pull + restart compose stack on Vultr
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/oidc-bridge
            chmod 600 .env.render
            mv .env.render .env
            docker compose pull
            docker compose up -d --remove-orphans
            # Wait for the new container to report healthy before exiting.
            for _ in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || echo "starting")
              echo "app health: $status"
              if [ "$status" = "healthy" ]; then
                docker image prune -f
                exit 0
              fi
              sleep 2
            done
            echo "app never reported healthy after deploy" >&2
            docker compose logs --tail=100 app >&2 || true
            exit 1
